<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Mess Waste Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- Header with app name and subtitle -->
    <header>
      <h1>Hostel Mess Waste Tracker</h1>
      <p class="subtitle">Tell the mess if you're eating. Waste less food.</p>
    </header>

    <!-- Two toggle buttons under the header -->
    <div class="view-toggle">
      <button id="student-btn" class="active">Student</button>
      <button id="manager-btn">Manager</button>
    </div>

    <!-- Student View (visible by default) -->
    <section id="student-view">
      <h2>Today's Meals</h2>
      <p id="today-date"></p>
      <div id="meal-list"></div>
      <p id="save-status"></p>
      <p id="clock-note">Demo limitation: uses this device's clock.</p>
    </section>

    <!-- Manager View (hidden by default) -->
    <section id="manager-view" class="hidden">
      <h2>Mess Dashboard</h2>
      <p id="dashboard-date"></p>
      <div id="dashboard-list"></div>
      <div id="savings-box"></div>
    </section>
  </div>

  <!-- Scripts: config loaded first, then storage, then app logic -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
